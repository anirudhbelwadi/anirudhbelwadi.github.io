name: Renew PythonAnywhere web app

on:
  schedule:
    # Weekly, so a failed or missed run still leaves three more attempts
    # before a 30-day expiry.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pythonanywhere
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Require credentials
        env:
          PA_USERNAME: ${{ vars.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: |
          missing=()
          [ -n "${PA_USERNAME:-}" ] || missing+=("PA_USERNAME (repository variable)")
          [ -n "${PA_PASSWORD:-}" ] || missing+=("PA_PASSWORD (repository secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Renewal not configured::Missing ${#missing[@]} setting(s)"
            printf 'Missing required setting: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Extend expiry
        env:
          PA_USERNAME: ${{ vars.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
          PA_DOMAIN: ${{ vars.PA_DOMAIN }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python .github/scripts/renew_pythonanywhere.py

      - name: Confirm the site is serving
        env:
          PA_DOMAIN: ${{ vars.PA_DOMAIN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://${PA_DOMAIN}/")
          echo "https://${PA_DOMAIN}/ -> ${code}"
          [ "$code" = "200" ] || { echo "::error::Site is not serving after renewal"; exit 1; }

      # A silent failure here means the app expires and the analytics backend
      # goes down, so leave something behind that outlives the run log.
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'PythonAnywhere renewal failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pythonanywhere',
            });
            const body = `The scheduled renewal failed.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}\n\n` +
              `Renew manually at https://www.pythonanywhere.com/user/${{ vars.PA_USERNAME }}/webapps/ ` +
              `until this is fixed.`;
            if (existing.some((i) => i.title === title)) {
              console.log('An open issue already exists; not filing another.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pythonanywhere'],
            });
