name: Deploy backend to PythonAnywhere

on:
  push:
    branches: [master]
    paths:
      - 'backend-service/**'
      - '.github/scripts/deploy_pythonanywhere.py'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would deploy, upload nothing'
        type: boolean
        default: false
      mode:
        description: 'app = code and templates; images = copy the image library across'
        type: choice
        options: [app, images]
        default: app

permissions:
  contents: read

# Never let two deploys write to the web app at once.
concurrency:
  group: pythonanywhere
  cancel-in-progress: false

defaults:
  run:
    # -u catches typo'd variable names, -o pipefail stops a failure mid-pipeline
    # from being masked by a successful tail command.
    shell: bash -euo pipefail {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
      PA_USERNAME: ${{ vars.PA_USERNAME }}
      PA_DOMAIN: ${{ vars.PA_DOMAIN }}
      PA_REMOTE_DIR: ${{ vars.PA_REMOTE_DIR }}
      PA_HOST: ${{ vars.PA_HOST || 'www.pythonanywhere.com' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      PA_MODE: ${{ github.event.inputs.mode || 'app' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # Runs first and without credentials, so a tripped safety guard shows up
      # in the log before anything touches the server.
      - name: Preview manifest
        env:
          PA_DRY_RUN: 'true'
        run: python .github/scripts/deploy_pythonanywhere.py

      # A deploy that cannot run is a failure, not a warning: a silently skipped
      # deploy is indistinguishable from a successful one in the Actions list.
      - name: Require configuration
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          missing=()
          [ -n "${PA_API_TOKEN:-}" ]  || missing+=("PA_API_TOKEN (repository secret)")
          [ -n "${PA_USERNAME:-}" ]   || missing+=("PA_USERNAME (repository variable)")
          [ -n "${PA_DOMAIN:-}" ]     || missing+=("PA_DOMAIN (repository variable)")
          [ -n "${PA_REMOTE_DIR:-}" ] || missing+=("PA_REMOTE_DIR (repository variable)")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Backend deploy not configured::Missing ${#missing[@]} setting(s)"
            printf 'Missing required setting: %s\n' "${missing[@]}" >&2
            echo >&2
            echo "Set them with:" >&2
            echo "  gh secret set PA_API_TOKEN" >&2
            echo "  gh variable set PA_REMOTE_DIR --body /home/<user>/<app-dir>" >&2
            exit 1
          fi
          echo "All required settings present."

      - name: Upload and reload
        if: ${{ env.DRY_RUN != 'true' }}
        run: python .github/scripts/deploy_pythonanywhere.py
